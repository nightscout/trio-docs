name: Prevent Blocked PRs from being Merged

on:
  pull_request_target:
    types:
      - opened
      - edited
      - closed
      - reopened
  issues:
    types:
      - opened
      - edited
      - deleted
      - transferred
      - closed
      - reopened

jobs:
  blocking_issues:
    permissions:
      checks: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: Levi-Lesches/blocking-issues@v2
